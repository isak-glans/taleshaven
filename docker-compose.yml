# Utvecklingsdatabas. Starta med: docker compose up -d
services:
  postgres:
    image: postgres:18
    container_name: taleshaven-postgres
    environment:
      POSTGRES_DB: taleshaven
      POSTGRES_USER: taleshaven
      POSTGRES_PASSWORD: taleshaven_dev
    ports:
      - "5432:5432"
    volumes:
      - taleshaven-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taleshaven -d taleshaven"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Låtsasbrevlåda för utveckling (B70): appen skickar till port 1025, mejlen läses på http://localhost:8025.
  mailpit:
    image: axllent/mailpit
    container_name: taleshaven-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  taleshaven-pgdata:
